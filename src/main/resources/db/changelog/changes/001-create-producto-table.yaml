databaseChangeLog:
  - changeSet:
      id: 001-create-producto-table
      author: jccg0510
      changes:
        - createTable:
            tableName: producto
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nombre
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: precio
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: cantidad_stock
                  type: INT
                  constraints:
                    nullable: false
