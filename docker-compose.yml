services:
  db:
    image: mysql:8.4
    container_name: app-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-net

  app:
    build: .
    container_name: app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: app_db
      DB_USER: app_user
      DB_PASSWORD: app_password
      # Habilita el debug remoto (JDWP) en el puerto 5005.
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    ports:
      - "8080:8080"
      - "5005:5005"
    networks:
      - app-net
    develop:
      watch:
        # Al cambiar codigo fuente o el pom, reconstruye la imagen de la app.
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./pom.xml

  adminer:
    image: adminer
    container_name: app-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  db_data:
